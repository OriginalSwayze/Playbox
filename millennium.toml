[plugin]
id = "com.originalswayze.kestrel"
name = "Playbox"
version = "1.0.0"
author = "OriginalSwayze"
description = "124 complete interfaces for the Steam client in one box, from a cinematic dashboard to a newspaper, a record shop and a 90s desktop, switchable from a button in every top strip. Built on Steam's own library, downloads and friends data."

[assets]
resources = ["resources/**/*"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "KST"
webview_prefix  = "KSW"

[patches]
debug = false
