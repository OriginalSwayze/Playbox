[plugin]
id = "com.originalswayze.kestrel"
name = "Kestrel"
version = "0.1.0"
author = "OriginalSwayze"
description = "A new interface for the Steam client: spaces, a command bar, a cinematic dashboard and redesigned game pages, built on Steam's own library, downloads and friends data."

[assets]
resources = ["resources/**/*"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "never"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "KST"
webview_prefix  = "KSW"

[patches]
debug = false
